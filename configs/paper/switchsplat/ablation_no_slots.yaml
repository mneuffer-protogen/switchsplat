# @package _global_
# Ablation of the SwitchSplat paper (Kitchen 2): no object slots (and so none of their losses).

defaults:
  - /apps/colmap_switchsplat
  - _self_

switch_splat:
  init_windows_file: null
  init_windows: []
  num_slots: 0
  logit_softening:
    enabled: false

loss:
  use_mode_a: false
  lambda_mode_a: 0.0
  use_slot_spatial_conc: false
  lambda_slot_spatial_conc: 0.0
